# Dependabot:每月檢查依賴、有新版自動開 PR(附 changelog)。
# 每個 ecosystem 都用 groups 把更新併成單一 PR，壓低單人專案的 PR 噪音 ——
# 一個月大約各一顆 PR，review + CI 綠即 merge，即完成 pipeline / 前後端依賴維護。
version: 2
updates:
  # ---- GitHub Actions（workflow 裡的 uses: 版本，如 checkout / setup-node / gh-release）----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # ---- 前端 npm（Angular；package.json / package-lock.json 在 src/Pm.Web）----
  - package-ecosystem: "npm"
    directory: "/src/Pm.Web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]

  # ---- 後端 NuGet（Central Package Management：版本集中在 root Directory.Packages.props，
  #      Dependabot 只更新該檔，免逐 csproj 掃、免跨專案誤試）----
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget:
        patterns: ["*"]
