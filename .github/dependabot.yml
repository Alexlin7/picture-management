# Dependabot:每月檢查依賴、有新版自動開 PR(附 changelog)。
# group 只併 minor + patch(對齊「patch/minor 自動合、major 手動 review」策略)——
# major 各自拆獨立 PR,壞也只壞它自己,不連累同批的安全 patch。
version: 2
updates:
  # ---- GitHub Actions（workflow 裡的 uses: 版本，如 checkout / setup-node / gh-release）----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- 前端 npm（Angular；package.json / package-lock.json 在 src/Pm.Web）----
  - package-ecosystem: "npm"
    directory: "/src/Pm.Web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- 後端 NuGet（Central Package Management：版本集中在 root Directory.Packages.props，
  #      Dependabot 只更新該檔，免逐 csproj 掃、免跨專案誤試）----
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # ImageSharp v4+ 於 build 時強制授權金鑰(沒 key 直接 build 失敗);
      # 單人本機工具留在 3.1.x。要升 v4 需先取得 Six Labors 授權並設 key,屆時移除本行。
      - dependency-name: "SixLabors.ImageSharp"
        update-types: ["version-update:semver-major"]
